services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: geodata5-sso:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sso
      SPRING_DATASOURCE_USERNAME: ${PG_USER:-sso}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD:?set in .env}
      SPRING_DATA_REDIS_HOST: redis
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sso
      POSTGRES_USER: ${PG_USER:-sso}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # first-boot: apply the schema in sql/sas/ and src/main/resources/db/schema-cas.sql
      - ../sql/sas:/docker-entrypoint-initdb.d/01-sas:ro
      - ../src/main/resources/db/schema-cas.sql:/docker-entrypoint-initdb.d/02-cas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sso} -d sso"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
